<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore leadership and professional role listings through Primax Talent Connectors, with opportunities across technology, finance, operations, people, and commercial functions.">
  <meta name="theme-color" content="#0B2F4A">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://primaxtalentconnectors.com/live-roles.html">
  <meta property="og:title" content="Live Roles | Primax Talent Connectors">
  <meta property="og:description" content="Discover opportunities through Primax Talent Connectors.">
  <meta property="og:image" content="https://primaxtalentconnectors.com/LOGO.jpg">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Live Roles | Primax Talent Connectors">
  <meta name="twitter:description" content="Explore leadership and professional role listings across multiple industries and functions.">
  <meta name="twitter:image" content="https://primaxtalentconnectors.com/LOGO.jpg">
  <link rel="icon" href="LOGO.jpg" type="image/jpeg"><link rel="canonical" href="https://primaxtalentconnectors.com/live-roles.html"><link rel="stylesheet" href="styles.css">
  <title>Live Roles | Primax Talent Connectors</title>
</head>
<body data-page="roles">
  <a class="skip-link" href="#main">Skip to content</a><div id="site-header"></div>
  <main id="main">
    <section class="page-hero"><div class="container page-hero-inner"><p class="eyebrow eyebrow-light">Live roles</p><h1>Explore opportunities.</h1></div></section>
    <section class="section section-white role-search-section">
      <div class="container">
        <form class="filter-panel" id="role-filters" role="search" aria-label="Filter open roles">
          <div class="filter-search"><label for="role-search">Search roles</label><input id="role-search" name="search" type="search" placeholder="Title, keyword, industry..." autocomplete="off"></div>
          <div><label for="level-filter">Level</label><select id="level-filter" name="level"><option value="">All levels</option></select></div>
          <div><label for="industry-filter">Industry</label><select id="industry-filter" name="industry"><option value="">All industries</option></select></div>
          <div><label for="function-filter">Function</label><select id="function-filter" name="function"><option value="">All functions</option></select></div>
          <div><label for="work-type-filter">Work type</label><select id="work-type-filter" name="workType"><option value="">All work types</option></select></div>
          <button class="button button-outline clear-filters" type="reset">Clear filters</button>
        </form>
        <div class="results-heading" id="results-heading"><p id="role-count" aria-live="polite"></p></div>
        <div class="role-grid role-grid-list" id="role-results" data-role-list="all"></div>
        <div class="empty-state" id="role-empty" hidden></div>
      </div>
    </section>
    <section class="section section-soft"><div class="container employer-strip-inner"><div><p class="eyebrow">Want to be considered?</p><h2>Join our talent network.</h2><p>We’ll contact you when a suitable role comes up.</p></div><a class="button button-green" href="contact.html#candidate-form">Join the Talent Network <span aria-hidden="true">↗</span></a></div></section>
  </main>
  <div id="site-footer"></div><script src="js/data.js" defer></script><script src="js/site.js" defer></script>
</body>
</html>
