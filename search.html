<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Search pages and information on the Primax Talent Connectors website.">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#0B2F4A">
  <link rel="icon" href="LOGO.jpg" type="image/jpeg">
  <link rel="canonical" href="https://primaxtalentconnectors.com/search.html">
  <link rel="stylesheet" href="styles.css">
  <title>Search | Primax Talent Connectors</title>
</head>
<body data-page="search">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>
  <main id="main">
    <section class="page-hero page-hero-short">
      <div class="container page-hero-inner">
        <p class="eyebrow eyebrow-light">Website search</p>
        <h1>Find what you need.</h1>
        <p>Search pages and topics across Primax Talent Connectors.</p>
      </div>
    </section>
    <section class="section section-white site-search-section">
      <div class="container site-search-content">
        <form class="site-search-form" id="site-search-form" action="search.html" method="get" role="search">
          <label for="site-search-query">Search the website</label>
          <div class="site-search-controls">
            <input id="site-search-query" name="q" type="search" placeholder="Try “roles”, “finance”, or “employer”" autocomplete="off">
            <button class="button button-green" type="submit">Search</button>
          </div>
        </form>
        <section class="site-search-output" aria-labelledby="site-search-heading">
          <h2 id="site-search-heading">Search Primax Talent Connectors</h2>
          <p id="site-search-count" aria-live="polite">Enter a word or phrase to search the website.</p>
          <ul id="site-search-results" class="site-search-results" aria-live="polite"></ul>
        </section>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="js/data.js" defer></script>
  <script src="js/site.js" defer></script>
</body>
</html>
